<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Pulso · Intranet de exercícios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login" class="login" hidden>
    <h1 id="login-title">Entrar na intranet do Pulso</h1>
    <p id="login-help">Informe seu e-mail para receber um código de 6 dígitos.</p>
    <form id="email-form">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <button class="btn" type="submit" id="send-code">Enviar código</button>
    </form>
    <form id="code-form" hidden>
      <div class="field">
        <label for="code">Código</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
      </div>
      <button class="btn" type="submit" id="verify">Entrar</button>
      <button class="btn secondary" type="button" id="back">Usar outro e-mail</button>
    </form>
    <p id="login-error" class="error" role="alert"></p>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <h1>Exercícios do Pulso</h1>
      <div><span class="who" id="who"></span><button class="btn secondary small" id="logout" type="button">Sair</button></div>
    </header>
    <main>
      <div id="no-permission" class="banner" role="status" hidden>Sem permissão para editar</div>
      <div class="toolbar">
        <span class="counter" id="counter" aria-live="polite"></span>
        <div class="chips" role="group" aria-label="Filtrar por prioridade" id="prio-chips"></div>
        <label class="toggle"><input type="checkbox" id="only-missing"> Só sem imagem</label>
      </div>
      <details class="usage" id="usage" hidden>
        <summary>Dicas de uso</summary>
        <p id="usage-text"></p>
      </details>
      <p id="load-error" class="error" role="alert"></p>
      <div class="grid" id="grid"></div>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
